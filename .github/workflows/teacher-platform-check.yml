name: Teacher Platform - Smoke Check

on:
  push:
    branches:
      - teacher-platform
    paths:
      - "teacher-platform/**"
      - ".github/workflows/teacher-platform-check.yml"
  pull_request:
    branches:
      - teacher-platform
    paths:
      - "teacher-platform/**"
      - ".github/workflows/teacher-platform-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Verify application entry point and RTL shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          page = Path("teacher-platform/index.html")
          if not page.is_file():
              sys.exit("FAIL: teacher-platform/index.html is missing")
          html = page.read_text(encoding="utf-8")
          checks = {
              "HTML doctype": "<!doctype html" in html.lower(),
              "Arabic RTL direction": 'dir="rtl"' in html,
              "Arabic language": 'lang="ar"' in html,
              "responsive viewport": 'name="viewport"' in html,
              "local persistence": "localStorage" in html,
          }
          for label, passed in checks.items():
              print(f'{"PASS" if passed else "FAIL"}: {label}')
          if not all(checks.values()):
              sys.exit(1)
          print(f"PASS: entry point exists ({page.stat().st_size} bytes)")
          PY

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("teacher-platform/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise SystemExit("FAIL: no inline application script found")
          Path("/tmp/teacher-platform-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
          node --check /tmp/teacher-platform-inline.js
